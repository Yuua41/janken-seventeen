<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じゃんけん</title>
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP" rel="stylesheet" />
  <link rel="stylesheet" href="css/janken.css">
</head>

<body>
  <main>

    <section>
      <h1>じゃんけん</h1>
    </section>

    <section id="cpu">
      <p>コンピュータの手は？？</p>
    </section>

    <section id="result">
      <p>勝敗は？？</p>
    </section>

    <section id="button">
      <button id="button_01">グー</button>
      <button id="button_02">チョキ</button>
      <button id="button_03">パー</button>
    </section>

  </main>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
    const randomNumber_01 = Math.floor(Math.random()*3);
    console.log(randomNumber_01);

    const randomNumber_02 = Math.floor(Math.random()*3);
    console.log(randomNumber_02);

//コンピューターの手
$("#button").on("click", function () {
        if (randomNumber_01 === 0){
        $("#cpu").text("グー")
      
    }else if(randomNumber_01 === 1){
        $("#cpu").text("チョキ")
    }else{
        $("#cpu").text("パー")
    }
  });

  $("#button_01").on("click", function () {
        if (randomNumber_01 === 0){
        $("#result").text("あいこ")
      
    }else if(randomNumber_01 === 1){
        $("#result").text("勝ち")
    }else{
        $("#result").text("負け")
    }
  });

    $("#button_02").on("click", function () {
        if (randomNumber_01 === 0){
        $("#result").text("負け")
      
    }else if(randomNumber_01 === 1){
        $("#result").text("あいこ")
    }else{
        $("#result").text("勝ち")
    }
  });

      $("#button_03").on("click", function () {
        if (randomNumber_01 === 0){
        $("#result").text("勝ち")
      
    }else if(randomNumber_01 === 1){
        $("#result").text("負け")
    }else{
        $("#result").text("あいこ")
    }
  });



</script>


</body>



</html>
